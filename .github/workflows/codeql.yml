name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * 3"
  workflow_dispatch:

permissions: read-all

jobs:
  plan:
    name: Plan CodeQL
    runs-on: ubuntu-24.04
    outputs:
      actions: ${{ steps.scope.outputs.actions }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          actions=false
          rust=false
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            actions=true
            rust=true
          else
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/codeql.yml)
                  actions=true
                  rust=true
                  ;;
                .github/*|action.yml|action.yaml|*/action.yml|*/action.yaml)
                  actions=true
                  ;;
              esac
              case "$path" in
                *.rs|Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock|.cargo/*|rust-toolchain|rust-toolchain.toml|xtask/*)
                  rust=true
                  ;;
              esac
            done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA")
          fi
          echo "actions=$actions" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  analyze-actions:
    needs: plan
    if: ${{ needs.plan.outputs.actions == 'true' }}
    name: Analyze actions
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:actions"

  analyze-rust:
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    name: Analyze rust
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: rust
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:rust"
