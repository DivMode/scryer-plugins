name: plugin-ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      plugin_ids: ${{ steps.scope.outputs.plugin_ids }}
      plugin_matrix: ${{ steps.scope.outputs.plugin_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine CI scope
        id: scope
        shell: bash
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          python3 .github/scripts/plan-plugin-ci.py \
            --changed-files "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

  build-xtask:
    needs: plan
    if: ${{ needs.plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build xtask
        run: cargo build --locked --manifest-path xtask/Cargo.toml

      - name: Upload xtask artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-ci-xtask-${{ github.run_id }}
          path: xtask/target/debug/xtask
          if-no-files-found: error
          retention-days: 1

  fmt:
    needs: [plan, build-xtask]
    if: ${{ needs.plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Download xtask artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-ci-xtask-${{ github.run_id }}
          path: xtask-artifact

      - name: Restore xtask binary
        run: |
          set -euo pipefail
          install -d xtask/target/debug
          install -m 0755 xtask-artifact/xtask xtask/target/debug/xtask

      - name: Check formatting
        run: ./xtask/target/debug/xtask ci fmt

  clippy:
    needs: [plan, build-xtask]
    if: ${{ needs.plan.outputs.mode != 'none' }}
    name: clippy (${{ matrix.plugin_id || 'not-needed' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.plugin_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download xtask artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-ci-xtask-${{ github.run_id }}
          path: xtask-artifact

      - name: Restore xtask binary
        run: |
          set -euo pipefail
          install -d xtask/target/debug
          install -m 0755 xtask-artifact/xtask xtask/target/debug/xtask

      - name: Run strict clippy
        run: ./xtask/target/debug/xtask ci clippy --plugin-id "${{ matrix.plugin_id }}"

      - name: Install WASI SDK for enhanced subtitle sync
        if: ${{ matrix.plugin_id == 'enhanced-subtitle-sync' }}
        shell: bash
        run: |
          set -euo pipefail
          readonly wasi_sdk_version='33.0'
          readonly wasi_sdk_archive="wasi-sdk-${wasi_sdk_version}-x86_64-linux.tar.gz"
          readonly wasi_sdk_sha256='0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce'
          readonly wasi_sdk_root="${RUNNER_TEMP}/wasi-sdk-${wasi_sdk_version}"
          readonly wasi_sdk_url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/${wasi_sdk_archive}"
          curl -fsSL "$wasi_sdk_url" -o "${RUNNER_TEMP}/${wasi_sdk_archive}"
          printf '%s  %s\n' "$wasi_sdk_sha256" "${RUNNER_TEMP}/${wasi_sdk_archive}" | sha256sum --check --strict
          mkdir "$wasi_sdk_root"
          tar -xzf "${RUNNER_TEMP}/${wasi_sdk_archive}" -C "$wasi_sdk_root" --strip-components=1
          test -x "$wasi_sdk_root/bin/clang"
          test -d "$wasi_sdk_root/share/wasi-sysroot"
          echo "$wasi_sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "FFMPEG_WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "CLANG=$wasi_sdk_root/bin/clang"
            echo "LLVM_AR=$wasi_sdk_root/bin/llvm-ar"
            echo "LLVM_NM=$wasi_sdk_root/bin/llvm-nm"
            echo "LLVM_RANLIB=$wasi_sdk_root/bin/llvm-ranlib"
            echo "LLVM_STRIP=$wasi_sdk_root/bin/llvm-strip"
          } >> "$GITHUB_ENV"

      - name: Prefetch plugin release dependencies
        run: ./xtask/target/debug/xtask official prefetch "${{ matrix.plugin_id }}"

      - name: Validate official plugins through the release Wasm path
        run: ./xtask/target/debug/xtask plugin validate-all --plugin-id "${{ matrix.plugin_id }}"

  clippy-xtask:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Clippy for the active toolchain
        run: rustup component add clippy --toolchain "$(rustup show active-toolchain | awk '{print $1}')"

      - name: Run strict clippy for xtask
        run: cargo clippy --all-targets --all-features --locked --manifest-path xtask/Cargo.toml -- -D warnings

  audit:
    needs: [plan, build-xtask]
    if: ${{ needs.plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-audit

      - name: Download xtask artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-ci-xtask-${{ github.run_id }}
          path: xtask-artifact

      - name: Restore xtask binary
        run: |
          set -euo pipefail
          install -d xtask/target/debug
          install -m 0755 xtask-artifact/xtask xtask/target/debug/xtask

      - name: Run cargo audit
        env:
          CI_SCOPE: ${{ needs.plan.outputs.mode }}
          CI_PLUGIN_IDS: ${{ needs.plan.outputs.plugin_ids }}
        run: |
          scope_args=()
          if [[ "$CI_SCOPE" == "scoped" ]]; then
            IFS=',' read -r -a plugin_ids <<< "$CI_PLUGIN_IDS"
            for plugin_id in "${plugin_ids[@]}"; do
              scope_args+=(--plugin-id "$plugin_id")
            done
          fi
          ./xtask/target/debug/xtask ci audit "${scope_args[@]}"

  gate:
    if: ${{ always() }}
    needs: [plan, build-xtask, fmt, clippy, clippy-xtask, audit]
    name: plugin-ci gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify planned CI completed
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BUILD_XTASK: ${{ needs.build-xtask.result }}
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          CLIPPY_XTASK: ${{ needs.clippy-xtask.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          case "$MODE" in
            none)
              test "$BUILD_XTASK" = skipped
              test "$FMT" = skipped
              test "$CLIPPY" = skipped
              test "$CLIPPY_XTASK" = skipped
              test "$AUDIT" = skipped
              ;;
            scoped)
              test "$BUILD_XTASK" = success
              test "$FMT" = success
              test "$CLIPPY" = success
              test "$CLIPPY_XTASK" = skipped
              test "$AUDIT" = success
              ;;
            full)
              test "$BUILD_XTASK" = success
              test "$FMT" = success
              test "$CLIPPY" = success
              test "$CLIPPY_XTASK" = success
              test "$AUDIT" = success
              ;;
            *)
              echo "Unexpected CI mode: $MODE" >&2
              exit 1
              ;;
          esac
