[package]
name = "aria2-download-client"
version = "0.1.3"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "Aria2 XML-RPC torrent download client plugin"

[package.metadata.scryer]
official = true
plugin_id = "aria2"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.17.4"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/aria2"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/aria2"

[[bin]]
name = "aria2-download-client"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
roxmltree = "0.20"
scryer-plugin-sdk = "3.7.0"
scryer-plugin-pdk = "0.5.0"
serde_json = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
